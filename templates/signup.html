<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGN UP PAGE</title>
    <style>
    body {font-family: Arial, sans-serif;
    margin: 50px auto;
    max-width: 400px; 
    background-color: #F4F6F4;
    color: #070707;
    padding: 20px;}
    h1 {font-size: 28px;
    font-weight: bold;
    margin-bottom: 5px;
    text-transform: uppercase;}
    p {color: #666;
    font-size: 14px;
    margin-top: 0;
    margin-bottom: 20px;}
    hr {border: 0;
    border-top: 1px solid #ccc;
    margin-bottom: 25px;}
    h2 {font-size: 22px;
    margin-bottom: 20px;}
    .form-row {margin-bottom: 15px;}
    label {display: block;
    font-weight: bold;
    margin-bottom: 8px;}
input[type="text"], 
input[type="email"], 
input[type="password"], 
select {width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
    font-size: 14px;
    background-color: #FFFFFF;}
button {background-color: #9CAF88;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    width: 100%;
    font-size: 14px;
    margin-top: 10px;}
button:hover {background-color: #899C75;}
.footer-text {margin-top: 20px;
    text-align: center;
    color: #555;
    font-size: 14px;}
.footer-text a {color: #D69F8C;
    text-decoration: none;}
.footer-text a:hover {text-decoration: underline;}
</style>
</head>
<body>
    <h1>CREATE AN ACCOUNT</h1>
<p>Join Trekking Platform to Begin Your Journeys</p>
<hr>

<h2>Register</h2>
<form method="POST" action="/signup">
    <div class="form-row">
        <label>Full Name:</label>
        <input type="text" name="name" required>
    </div>

    <div class="form-row">
        <label>Email:</label>
        <input type="email" name="email" required>
    </div>

    <div class="form-row">
        <label>Password:</label>
        <input type="password" name="password" required>
    </div>

    <div class="form-row">
        <label>Contact Number:</label>
        <input type="text" name="contact" required>
    </div>

    <div class="form-row">
        <label>Select Role:</label>
        <select name="role" required>
            <option value="">-- Select --</option>
            <option value="trekker">User (Trekker)</option>
            <option value="staff">Trek Staff</option>
        </select>
    </div>

    <button type="submit">Submit Registration</button>
</form>

<p class="footer-text">
    Already have an account? <a href="/">Login</a>
</p>

</body>
</html>
