<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <style>
        body {font-family: Arial, sans-serif;
    margin: 50px auto;
    max-width: 400px; 
    background-color: #F4F6F4; 
    color: #070707;
    padding: 20px;}
h2 {font-size: 26px;
    font-weight: bold;
    margin-bottom: 25px;}
.form-row {margin-bottom: 15px;}
label {display: block;
    font-weight: bold;
    margin-bottom: 8px;}
input[type="text"], 
input[type="email"] {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
    font-size: 14px;
    background-color: #FFFFFF;}
.button-group {display: flex;
    align-items: center;
    gap: 15px;
    margin-top: 20px;}
button {background-color: #9CAF88;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    transition: background-color 0.2s ease;}
button:hover {background-color: #899C75;}
a {color: #666;
    text-decoration: none;
    font-size: 14px;}
a:hover {text-decoration: underline;}
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Update Your Profile Info</h2>
        <form method="POST" action="/edit_profile">
            <div class="form-group">
                <label>Full Name:</label>
                <input type="text" name="name" value="{{ user.name }}" required>
            </div><br>
            <div class="form-group">
                <label>Email Address:</label>
                <input type="email" name="email" value="{{ user.email }}" required>
            </div><br>
            <div class="form-group">
                <label>Contact Number:</label>
                <input type="text" name="contact" value="{{ user.contact }}" required>
            </div><br>
            <button type="submit">Save Changes</button>
            <a href="/trekker" style="margin-left: 15px; color: #666; text-decoration: none;">Cancel</a>
        </form>
    </div>
</body>
</html>
