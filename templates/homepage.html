<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME PAGE</title>
    <style>
body {background-color: #F4F6F4;
    color: #070707;
    font-family: Arial, sans-serif;
    margin: 50px auto;
    max-width: 400px; 
    padding: 20px;}
h1, h2 {color: #070707;
    margin-bottom: 5px;}
p {color: #555;
    margin-top: 0;}
.form-row {margin-bottom: 15px;}
label {display: block;
    font-weight: bold;
    margin-bottom: 5px;}
input[type="email"], input[type="password"] {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;}
button {background-color: #9CAF88;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    width: 100%;}
button:hover {background-color: #899C75;}
a {color: #D69F8C; 
    text-decoration: none;}
 </style> 
</head>
<body>
<h1>WELCOME TO TREKKING WEBSITE</h1>
<p>Explore Upcoming Treks & Manage Journeys</p>
<hr>

<h2>Login</h2><br>
<form method="POST" action="/">
    <div class="form-row">
        <label>Email:</label>
        <input type="email" name="email" required>
    </div>

    <div class="form-row">
        <label>Password:</label>
        <input type="password" name="password" required>
    </div>
    <button type="submit">Submit</button>
</form>

<p style="margin-top: 20px; text-align: center;">
    Don't have an account? <a href="/signup">Sign Up</a>
</p>
</body>
</html>
